<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Servidor asíncrono de imágenes</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
    <h1>Servidor asíncrono de imágenes</h1>
    <p>Prueba del transporte binario PAI/1 para vistas por chunks.</p>
    <p><strong>WebSocket:</strong> <span id="connectionStatus">Conectando...</span></p>
    <p><strong>Catálogo:</strong> <span id="catalogStatus">Pendiente</span></p>
    <p>
        <label for="imageSelect">Imagen disponible:</label>
        <select id="imageSelect" disabled></select>
    </p>
    <p id="imageInfo">Ninguna imagen seleccionada</p>
    <p>
        <button id="sendValidView" disabled>Mostrar imagen</button>
        <button id="sendInvalidView" disabled>Enviar VIEW inválido</button>
    </p>
    <p><strong>Última acción:</strong> <span id="viewStatus">Ninguna</span></p>
    <canvas id="imageCanvas" width="1100" height="650" aria-label="Vista de la imagen seleccionada"></canvas>
    <p>Los JPEG recibidos se dibujan en el canvas. Movimiento y zoom interactivo quedan para después.</p>
</main>
<script src="/app.js"></script>
</body>
</html>
