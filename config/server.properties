# Configuracion del proceso Java. Se lee al iniciar; reiniciar tras editar.
# -port PUERTO sigue teniendo prioridad sobre port.
port=8080
# Lado del chunk en pixeles (128..1024); cambia la geometria de cada VIEW.
chunk.size=512
# Hilos HTTP/WebSocket y workers de imagen (1..32 cada uno).
server.threads=2
view.workers=2
# Cache compartida y cola de escritura por cliente, en MiB.
cache.maxMiB=32
writeQueue.maxMiB=32
# Calidad JPEG para zooms inferiores a 1:1; desde 1:1 se envian PNG.
jpeg.normalQuality=85
